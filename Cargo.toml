[package]
name = "tiny-s3-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-credential-types = "=1.2.14"
aws-sdk-s3 = "=1.132.0"
aws-sigv4 = "=1.4.3"
aws-smithy-checksums = "=0.64.7"
aws-smithy-types = "=1.4.7"
axum = "=0.8.9"
bytes = "=1.11.1"
chrono = { version = "=0.4.44", features = ["serde"] }
fs2 = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.13.0"
http = "=1.4.0"
http-body-util = "=0.1.3"
httpdate = "=1.0.3"
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"
# Pin metrics-util to the same version metrics-exporter-prometheus 0.18.3
# resolves to with our metrics 0.24.5 pin. metrics-util 0.20.1 (the previously
# resolved transitive) used the old metrics::KeyHasher which is incompatible
# with rapidhash Key hashing in metrics 0.24.4+, causing counters with
# identical labels to silently undercount. See
# https://github.com/metrics-rs/metrics/issues/692.
# This is a resolver pin even though we don't use metrics-util directly —
# don't remove as "unused".
metrics-util = { version = "=0.20.4", default-features = false }
# SigV4A (AWS4-ECDSA-P256-SHA256) inbound verification. Pinned to the same
# 0.11.1 release that aws-sigv4 1.4.3 already brings in transitively so we
# avoid carrying two ECDSA P-256 stacks.
p256 = { version = "=0.11.1", default-features = false, features = ["ecdsa", "std"] }
percent-encoding = "=2.3.2"
pin-project-lite = "=0.2.17"
quick-xml = "=0.40.0"
reqwest = { version = "=0.13.3", features = ["stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.11.0"
serde_json = "=1.0.151"
subtle = "=2.6.1"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.18"
tokio-util = { version = "=0.7.18", features = ["io"] }
typed-builder = "=0.23.2"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
zeroize = "=1.8.2"

[dev-dependencies]
aws-smithy-http-client = { version = "=1.1.12", features = ["rustls-aws-lc"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "=3.27.0"
testcontainers = "=0.27.3"
tokio-test = "=0.4.5"
tower = { version = "=0.5.3", features = ["util"] }
tracing-test = "=0.2.6"
