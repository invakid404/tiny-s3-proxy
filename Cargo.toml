[package]
name = "tiny-s3-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-credential-types = "=1.2.14"
aws-sdk-s3 = "=1.131.0"
aws-sigv4 = "=1.4.3"
aws-smithy-types = "=1.4.7"
axum = "=0.8.9"
bytes = "=1.11.1"
chrono = { version = "=0.4.44", features = ["serde"] }
http = "=1.4.0"
http-body-util = "=0.1.3"
metrics = "=0.24.3"
metrics-exporter-prometheus = "=0.18.1"
percent-encoding = "=2.3.2"
quick-xml = "=0.39.2"
reqwest = { version = "=0.13.3", features = ["stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.11.0"
serde_json = "=1.0.149"
thiserror = "=2.0.18"
tokio = { version = "=1.52.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.18"
tokio-util = { version = "=0.7.18", features = ["io"] }
typed-builder = "=0.23.2"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "=3.27.0"
testcontainers = "=0.27.3"
tokio-test = "=0.4.5"
tower = { version = "=0.5.3", features = ["util"] }
